<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AchievementEquation • Angles &amp; Ethos</title>
<style>
:root{--navy:#0a0a0a;--navy2:#10241a;--steel:#b9cdbf;--line:#1e6b42;--gold:#d4af37;--txt:#ffffff;--bad:#d9534f;--good:#4caf7a}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--navy);color:var(--txt)}
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#0d3b24,#0a0a0a);border-bottom:2px solid var(--gold);padding:10px 14px}
.brand{font-size:11px;letter-spacing:.18em;color:var(--steel);text-transform:uppercase}.brand b{color:var(--gold)}
h1{margin:2px 0 6px;font-size:20px;letter-spacing:.02em}h1 span{color:var(--gold)}
.who{display:flex;gap:6px;align-items:center;flex-wrap:wrap}select,input,textarea{background:var(--navy2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:15px;width:100%}
.who select{width:auto;flex:1}nav{display:flex;gap:4px;overflow-x:auto;margin-top:8px}
nav button{flex:0 0 auto;background:none;border:1px solid var(--line);color:var(--steel);border-radius:20px;padding:6px 12px;font-size:13px}
nav button.on{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:700}
main{padding:14px;max-width:720px;margin:0 auto;padding-bottom:80px}
.card{background:var(--navy2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:16px;color:var(--gold);text-transform:uppercase;letter-spacing:.08em}
.card h3{margin:12px 0 6px;font-size:14px}label{display:block;font-size:12px;color:var(--steel);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.06em}
.btn{background:var(--gold);color:var(--navy);border:0;border-radius:8px;padding:10px 14px;font-weight:700;font-size:15px;cursor:pointer}
.btn.sec{background:none;color:var(--txt);border:1px solid var(--steel)}.btn.sm{padding:6px 10px;font-size:13px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.scale{display:flex;gap:4px;flex-wrap:wrap}.scale button{flex:1;min-width:52px;padding:8px 2px;border-radius:8px;border:1px solid var(--line);background:#0f2d1e;color:var(--txt);font-size:12px}
.scale button b{display:block;font-size:15px}.scale button.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.scale button.elite{border-color:var(--gold)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--steel);color:var(--steel)}
.tag.comp{border-color:var(--gold);color:var(--gold)}.ph{font-size:11px;color:#f0c96b;background:#3a2e10;border-radius:6px;padding:2px 6px}
.muted{color:var(--steel);font-size:13px}.big{font-size:28px;font-weight:800;color:var(--gold)}
.list .it{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--navy);padding:10px 16px;border-radius:20px;font-weight:700;display:none}
footer{position:fixed;bottom:0;left:0;right:0;background:#0d3b24;border-top:1px solid var(--line);display:flex;gap:6px;padding:8px;justify-content:center}
footer a,footer button{font-size:12px;color:var(--steel);background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;text-decoration:none}
svg text{fill:var(--steel);font-size:10px}.legend span{font-size:12px;margin-right:10px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
</style></head><body>
<header><div class="brand"><b>Achievement</b>Equation • Prototype</div><h1>Angles <span>&amp;</span> Ethos</h1>
<div class="who"><span class="muted">Viewing as</span><select id="userSel"></select></div><nav id="nav"></nav></header>
<main id="app"></main><div class="toast" id="toast"></div>
<footer><a id="fb" href="mailto:clint@holdfasthq.com?subject=Angles%20%26%20Ethos%20feedback">✉ Feedback</a><button id="demoBtn">Load demo data</button><button id="resetBtn">Reset</button></footer>
<script>
const KEY='ae_angles_ethos_v1';
const ELITE=3; // PLACEHOLDER value for Elite — RC may change
const SCALE=[[-1,'Bad'],[0,'Average'],[1,'Good'],[2,'Excellent']];
const uid=()=>Math.random().toString(36).slice(2,9);
let S=load(); let tab=null; let draft={};
function blank(){return{team:'My Team',users:[{id:'coach1',name:'Coach',role:'coach'}],ethos:['Ethos 1 (placeholder)','Ethos 2 (placeholder)','Ethos 3 (placeholder)','Ethos 4 (placeholder)','Ethos 5 (placeholder)'],angles:{tools:'Tools',technology:'Technology'},sessions:[],entries:[],others:[],me:'coach1'}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){return blank()}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
const me=()=>S.users.find(u=>u.id===S.me)||S.users[0];
const athletes=()=>S.users.filter(u=>u.role!=='coach');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const avg=a=>{a=a.filter(x=>x!=null&&x!=='');return a.length?a.reduce((p,c)=>p+ +c,0)/a.length:null};
const fmt=v=>v==null?'—':(v>0?'+':'')+(+v).toFixed(1);
const sess=id=>S.sessions.find(s=>s.id===id);
const sorted=()=>[...S.sessions].sort((a,b)=>a.date.localeCompare(b.date));
function scaleHTML(key,val,comp){let h=SCALE.map(([v,l])=>`<button data-k="${key}" data-v="${v}" class="${val===v?'on':''}"><b>${v>0?'+':''}${v}</b>${l}</button>`).join('');
 if(comp)h+=`<button data-k="${key}" data-v="${ELITE}" class="elite ${val===ELITE?'on':''}"><b>+${ELITE}</b>Elite*</button>`;return `<div class="scale">${h}</div>`}
function tabsFor(r){return r==='coach'?[['sessions','Sessions'],['others','Score Others'],['team','Team Trends'],['roster','Roster'],['ethos','Ethos']]:r==='captain'?[['log','Log Session'],['others','Score Others'],['trends','My Trends'],['ethosv','Ethos']]:[['log','Log Session'],['trends','My Trends'],['ethosv','Ethos']]}
function render(){
 const us=document.getElementById('userSel');us.innerHTML=['coach','captain','athlete'].map(r=>`<optgroup label="${r[0].toUpperCase()+r.slice(1)}">`+S.users.filter(u=>u.role===r).map(u=>`<option value="${u.id}" ${u.id===S.me?'selected':''}>${esc(u.name)}${u.number?' #'+u.number:''}</option>`).join('')+'</optgroup>').join('');
 const tabs=tabsFor(me().role);if(!tabs.find(t=>t[0]===tab))tab=tabs[0][0];
 document.getElementById('nav').innerHTML=tabs.map(([k,l])=>`<button data-tab="${k}" class="${k===tab?'on':''}">${l}</button>`).join('');
 document.getElementById('app').innerHTML=(V[tab]||(()=>''))();after[tab]&&after[tab]();
}
const after={};
const V={
sessions(){const s=sorted().reverse();return `<div class="card"><h2>New Session</h2><p class="muted">Coach sets the Tactic and its Techniques for each session.</p>
<div class="row"><div><label>Date</label><input type="date" id="sDate" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Type</label><select id="sType"><option value="practice">Practice</option><option value="competition">Competition</option></select></div></div>
<label>Opponent (competition only)</label><input id="sOpp" placeholder="e.g. Lakeshore Lynx">
<label>Tactic (play / plan / process)</label><input id="sTac" placeholder="e.g. Breakout — strong-side up">
<label>Techniques (one step per line)</label><textarea id="sTech" rows="4" placeholder="D retrieves puck&#10;Shoulder check&#10;Pass to strong-side wing"></textarea>
<p><button class="btn" id="addSess">Create session</button></p></div>
<div class="card"><h2>Sessions (${s.length})</h2><div class="list">${s.map(x=>`<div class="it"><div><b>${esc(x.tactic)}</b><br><span class="muted">${x.date} · ${x.techniques.length} techniques · ${S.entries.filter(e=>e.sessionId===x.id).length}/${athletes().length} logged</span></div><span class="tag ${x.type==='competition'?'comp':''}">${x.type==='competition'?'vs '+esc(x.opponent||'Opp'):'Practice'}</span></div>`).join('')||'<p class="muted">No sessions yet.</p>'}</div></div>`},
log(){const ss=sorted().reverse();if(!ss.length)return `<div class="card"><h2>Log Session</h2><p class="muted">No sessions yet — your coach creates them.</p></div>`;
 if(!draft.sid||!sess(draft.sid))draft={sid:ss[0].id};const x=sess(draft.sid),comp=x.type==='competition';
 const ex=S.entries.find(e=>e.sessionId===x.id&&e.athleteId===S.me);if(!draft.loaded){Object.assign(draft,ex?JSON.parse(JSON.stringify(ex)):{techScores:[],ethos:[],factors:{}},{loaded:1,sid:x.id})}
 const d=draft,f=d.factors||{};const tac=avg(d.techScores||[]);
 return `<div class="card"><label style="margin-top:0">Session</label><select id="pickSess">${ss.map(s=>`<option value="${s.id}" ${s.id===x.id?'selected':''}>${s.date} · ${esc(s.tactic)}${s.type==='competition'?' (vs '+esc(s.opponent)+')':''}</option>`).join('')}</select>
 <p><span class="tag ${comp?'comp':''}">${comp?'Competition vs '+esc(x.opponent):'Practice'}</span> ${ex?'<span class="tag">Already logged — editing</span>':''}</p>
 <label>My focus for this session</label><input id="focus" value="${esc(d.focus)}" placeholder="What I'm working on today"></div>
 <div class="card"><h2>1 · Tactics</h2><b>${esc(x.tactic)}</b><div class="row" style="margin-top:6px"><span class="muted">Score (avg of Techniques)</span><span class="big" id="tacScore">${fmt(tac)}</span></div></div>
 <div class="card"><h2>2 · Techniques</h2>${x.techniques.map((t,i)=>`<h3>${i+1}. ${esc(t)}</h3>${scaleHTML('t'+i,d.techScores[i],comp)}`).join('')}${comp?'<p class="muted">*Elite only exists in competition. <span class="ph">+3 is a placeholder value</span></p>':''}</div>
 <div class="card"><h2>3 · Teammates — Self</h2><h3>Performance (skill)</h3>${scaleHTML('sp',d.selfPerf,comp)}<h3>Value (encouraging, sacrificial, humble, true to the plan)</h3>${scaleHTML('sv',d.selfVal,comp)}<p class="muted">Captains / coach score you as "Others".</p></div>
 <div class="card"><h2>4 · ${esc(S.angles.tools)}</h2><p class="muted">Fundamental tools used (e.g. edges, stick, voice)</p><input id="tools" value="${esc(d.tools)}">
 <h2 style="margin-top:14px">5 · ${esc(S.angles.technology)}</h2><p class="muted">Non-essential enhancements (map &amp; compass = tools, GPS = technology)</p><input id="techno" value="${esc(d.tech)}"></div>
 <div class="card"><h2>Ethos check-in <span class="ph">Proposal · optional</span></h2><p class="muted">Off-ice principles. Cadence TBD — proposed per-session self check.</p>${S.ethos.map((e,i)=>`<h3>${esc(e)}</h3>${scaleHTML('e'+i,(d.ethos||[])[i],false)}`).join('')}</div>
 <div class="card"><h2>Additional Factors</h2><div class="row"><div><label>Sleep (hrs)</label><input type="number" step="0.5" id="f_sleepH" value="${f.sleepH??''}"></div><div><label>Sleep quality 1-5</label><input type="number" min="1" max="5" id="f_sleepQ" value="${f.sleepQ??''}"></div></div>
 <div class="row"><div><label>Nutrition 1-5</label><input type="number" min="1" max="5" id="f_nutr" value="${f.nutr??''}"></div><div><label>Hydration 1-5</label><input type="number" min="1" max="5" id="f_hyd" value="${f.hyd??''}"></div></div>
 <div class="row"><div><label>Soreness 1-5</label><input type="number" min="1" max="5" id="f_sore" value="${f.sore??''}"></div><div><label>Stress 1-5</label><input type="number" min="1" max="5" id="f_stress" value="${f.stress??''}"></div></div>
 <label>Meals / notes</label><textarea id="f_notes" rows="2">${esc(f.notes)}</textarea></div>
 <button class="btn" id="saveLog" style="width:100%">Save entry</button>`},
others(){const ss=sorted().reverse();if(!ss.length)return '<div class="card"><p class="muted">No sessions yet.</p></div>';
 if(!draft.osid||!sess(draft.osid))draft.osid=ss[0].id;const x=sess(draft.osid),comp=x.type==='competition';
 return `<div class="card"><h2>Score Others</h2><p class="muted">Rate each teammate on Performance and Value.</p><select id="pickO">${ss.map(s=>`<option value="${s.id}" ${s.id===x.id?'selected':''}>${s.date} · ${esc(s.tactic)}</option>`).join('')}</select></div>`+
 athletes().filter(a=>a.id!==S.me).map(a=>{const o=S.others.find(o=>o.sessionId===x.id&&o.athleteId===a.id&&o.raterId===S.me)||{};
 return `<div class="card"><h3 style="margin-top:0">${esc(a.name)} ${a.number?'#'+a.number:''} ${a.role==='captain'?'<span class="tag comp">C</span>':''}</h3><label>Performance</label>${scaleHTML('op|'+a.id,o.perf,comp)}<label>Value</label>${scaleHTML('ov|'+a.id,o.val,comp)}</div>`}).join('')},
trends(){return trendView(S.me)},
team(){const as=athletes();const pick=draft.tAth||'__team';
 return `<div class="card"><h2>Team Rollup</h2><select id="tAth"><option value="__team">Whole team</option>${as.map(a=>`<option value="${a.id}" ${pick===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>`+(pick==='__team'?teamView():trendView(pick))},
roster(){return `<div class="card"><h2>Team</h2><input id="teamName" value="${esc(S.team)}"></div><div class="card"><h2>Roster &amp; Access</h2><div class="list">${S.users.map(u=>`<div class="it"><span>${esc(u.name)} ${u.number?'#'+u.number:''}</span><span class="row" style="flex:0 0 auto"><select data-role="${u.id}" style="width:auto">${['athlete','captain','coach'].map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select>${u.id!==S.me?`<button class="btn sec sm" data-del="${u.id}">✕</button>`:''}</span></div>`).join('')}</div>
<div class="row" style="margin-top:10px"><input id="nName" placeholder="Name"><input id="nNum" placeholder="#" style="max-width:60px"><button class="btn sm" id="addU" style="flex:0 0 auto">Add</button></div></div>
<div class="card"><h2>Angle labels</h2><label>Tools</label><input id="aTools" value="${esc(S.angles.tools)}"><label>Technology</label><input id="aTech" value="${esc(S.angles.technology)}"></div>`},
ethos(){return `<div class="card"><h2>Ethos</h2><p class="muted">Five off-ice principles (locker room, community). <span class="ph">Placeholders — GM will supply</span></p>${S.ethos.map((e,i)=>`<label>Ethos ${i+1}</label><input data-eth="${i}" value="${esc(e)}">`).join('')}<p><button class="btn" id="saveEth">Save Ethos</button></p></div>`},
ethosv(){return `<div class="card"><h2>Our Ethos</h2>${S.ethos.map((e,i)=>`<div class="it" style="padding:8px 0;border-bottom:1px solid var(--line)"><b style="color:var(--gold)">${i+1}</b> ${esc(e)}</div>`).join('')}<p class="muted">Defined by your coach.</p></div>`}
};
function seriesFor(aid){return sorted().map(s=>{const e=S.entries.find(e=>e.sessionId===s.id&&e.athleteId===aid);const os=S.others.filter(o=>o.sessionId===s.id&&o.athleteId===aid);
 return{label:s.date.slice(5),comp:s.type==='competition',tac:e?avg(e.techScores):null,sp:e?.selfPerf??null,sv:e?.selfVal??null,op:avg(os.map(o=>o.perf)),ov:avg(os.map(o=>o.val)),eth:e?avg(e.ethos||[]):null,sleep:e?.factors?.sleepH??null}}).filter(p=>p.tac!=null||p.op!=null)}
function chart(pts,lines,bar){if(!pts.length)return '<p class="muted">No data yet.</p>';const W=340,H=170,L=26,R=bar?24:6,T=8,B=20,iw=W-L-R,ih=H-T-B;const y=v=>T+ih*(1-(v+1)/4.2),x=i=>L+(pts.length<2?iw/2:iw*i/(pts.length-1));
 let g='';[-1,0,1,2,3].forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#1e6b42" stroke-dasharray="${v===0?'':'2 3'}"/><text x="2" y="${y(v)+3}">${v>0?'+':''}${v}</text>`);
 if(bar){const by=v=>T+ih*(1-v/12);pts.forEach((p,i)=>{if(p[bar.k]!=null)g+=`<rect x="${x(i)-4}" y="${by(p[bar.k])}" width="8" height="${T+ih-by(p[bar.k])}" fill="${bar.c}" opacity=".35"/>`});g+=`<text x="${W-R+2}" y="${by(8)+3}">8h</text>`}
 lines.forEach(l=>{let d='';pts.forEach((p,i)=>{if(p[l.k]!=null)d+=(d?'L':'M')+x(i).toFixed(1)+','+y(p[l.k]).toFixed(1)});g+=`<path d="${d}" fill="none" stroke="${l.c}" stroke-width="2"/>`;pts.forEach((p,i)=>{if(p[l.k]!=null)g+=`<circle cx="${x(i)}" cy="${y(p[l.k])}" r="${p.comp?3.5:2.2}" fill="${l.c}"/>`})});
 const step=Math.ceil(pts.length/6);pts.forEach((p,i)=>{if(i%step===0)g+=`<text x="${x(i)-10}" y="${H-5}">${p.label}</text>`});
 return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg><div class="legend">${lines.map(l=>`<span><i style="background:${l.c}"></i>${l.n}</span>`).join('')}${bar?`<span><i style="background:${bar.c};opacity:.5"></i>${bar.n}</span>`:''}</div>`}
function trendView(aid){const a=S.users.find(u=>u.id===aid);const p=seriesFor(aid);const last=k=>avg(p.slice(-5).map(x=>x[k]));
 return `<div class="card"><h2>${esc(a?.name)} — last 5</h2><div class="row" style="text-align:center"><div><div class="big">${fmt(last('tac'))}</div><span class="muted">Tactics</span></div><div><div class="big">${fmt(last('sp'))}</div><span class="muted">Self Perf</span></div><div><div class="big">${fmt(last('ov'))}</div><span class="muted">Others Value</span></div></div></div>
 <div class="card"><h2>Tactics vs Sleep</h2>${chart(p,[{k:'tac',c:'#d4af37',n:'Tactics'}],{k:'sleep',c:'#b9cdbf',n:'Sleep hrs'})}</div>
 <div class="card"><h2>Teammates — Self</h2>${chart(p,[{k:'sp',c:'#2fae66',n:'Self Perf'},{k:'sv',c:'#4caf7a',n:'Self Value'}])}</div>
 <div class="card"><h2>Teammates — Others</h2>${chart(p,[{k:'op',c:'#e07a5f',n:'Others Perf'},{k:'ov',c:'#ffffff',n:'Others Value'}])}</div>
 <div class="card"><h2>Ethos <span class="ph">Proposal</span></h2>${chart(p,[{k:'eth',c:'#d4af37',n:'Ethos avg'}])}<p class="muted">Larger dots = competition.</p></div>`}
function teamView(){const as=athletes();const p=sorted().map(s=>{const es=S.entries.filter(e=>e.sessionId===s.id);const os=S.others.filter(o=>o.sessionId===s.id);
 return{label:s.date.slice(5),comp:s.type==='competition',tac:avg(es.map(e=>avg(e.techScores))),sv:avg(es.map(e=>e.selfVal)),ov:avg(os.map(o=>o.val)),sleep:avg(es.map(e=>e.factors?.sleepH))}}).filter(x=>x.tac!=null);
 const rows=as.map(a=>{const q=seriesFor(a.id).slice(-5);return{a,t:avg(q.map(x=>x.tac)),o:avg(q.map(x=>x.ov)),n:S.entries.filter(e=>e.athleteId===a.id).length}}).sort((x,y)=>(y.t??-9)-(x.t??-9));
 return `<div class="card"><h2>Team Tactics vs Sleep</h2>${chart(p,[{k:'tac',c:'#d4af37',n:'Team Tactics'},{k:'ov',c:'#ffffff',n:'Others Value'}],{k:'sleep',c:'#b9cdbf',n:'Avg sleep'})}</div>
 <div class="card"><h2>Athletes (last 5)</h2><div class="list">${rows.map(r=>`<div class="it"><span>${esc(r.a.name)} <span class="muted">${r.n} logs</span></span><span>Tac <b style="color:var(--gold)">${fmt(r.t)}</b> · Val <b>${fmt(r.o)}</b></span></div>`).join('')}</div></div>`}
// events
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;
 if(b.dataset.tab){tab=b.dataset.tab;draft={};render();return}
 if(b.dataset.k){const k=b.dataset.k,v=+b.dataset.v;
  if(tab==='others'){const[t,aid]=k.split('|');let o=S.others.find(o=>o.sessionId===draft.osid&&o.athleteId===aid&&o.raterId===S.me);if(!o){o={sessionId:draft.osid,athleteId:aid,raterId:S.me};S.others.push(o)}o[t==='op'?'perf':'val']=v;save();b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));toast('Saved');return}
  grab();if(k[0]==='t')draft.techScores[+k.slice(1)]=v;else if(k==='sp')draft.selfPerf=v;else if(k==='sv')draft.selfVal=v;else if(k[0]==='e'){draft.ethos=draft.ethos||[];draft.ethos[+k.slice(1)]=v}
  b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));const t=document.getElementById('tacScore');if(t)t.textContent=fmt(avg(draft.techScores));return}
 if(b.id==='addSess'){const t=document.getElementById('sTac').value.trim(),te=document.getElementById('sTech').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!t||!te.length)return toast('Add a Tactic and Techniques');
  S.sessions.push({id:uid(),date:document.getElementById('sDate').value,type:document.getElementById('sType').value,opponent:document.getElementById('sOpp').value,tactic:t,techniques:te});save();render();toast('Session created')}
 if(b.id==='saveLog'){grab();const x=sess(draft.sid);if((draft.techScores||[]).filter(v=>v!=null).length<x.techniques.length)return toast('Score every Technique');
  const e={sessionId:draft.sid,athleteId:S.me,focus:draft.focus,techScores:draft.techScores,selfPerf:draft.selfPerf,selfVal:draft.selfVal,tools:draft.tools,tech:draft.tech,ethos:draft.ethos||[],factors:draft.factors};
  S.entries=S.entries.filter(q=>!(q.sessionId===e.sessionId&&q.athleteId===e.athleteId));S.entries.push(e);save();toast('Entry saved');draft={sid:draft.sid};render()}
 if(b.id==='addU'){const n=document.getElementById('nName').value.trim();if(!n)return;S.users.push({id:uid(),name:n,number:document.getElementById('nNum').value,role:'athlete'});save();render()}
 if(b.dataset.del){S.users=S.users.filter(u=>u.id!==b.dataset.del);save();render()}
 if(b.id==='saveEth'){document.querySelectorAll('[data-eth]').forEach(i=>S.ethos[+i.dataset.eth]=i.value);save();toast('Ethos saved')}
 if(b.id==='demoBtn'){if(confirm('Replace all data with demo team?')){S=demo();save();tab=null;draft={};render();toast('Demo loaded')}}
 if(b.id==='resetBtn'){if(confirm('Erase all data?')){S=blank();save();tab=null;draft={};render()}}
});
function grab(){const g=id=>document.getElementById(id);if(!g('focus'))return;draft.focus=g('focus').value;draft.tools=g('tools').value;draft.tech=g('techno').value;
 const n=id=>g(id).value===''?null:+g(id).value;draft.factors={sleepH:n('f_sleepH'),sleepQ:n('f_sleepQ'),nutr:n('f_nutr'),hyd:n('f_hyd'),sore:n('f_sore'),stress:n('f_stress'),notes:g('f_notes').value};draft.techScores=draft.techScores||[]}
document.addEventListener('change',ev=>{const t=ev.target;
 if(t.id==='userSel'){S.me=t.value;save();draft={};render()}
 if(t.id==='pickSess'){draft={sid:t.value};render()}
 if(t.id==='pickO'){draft.osid=t.value;render()}
 if(t.id==='tAth'){draft.tAth=t.value;render()}
 if(t.dataset.role){S.users.find(u=>u.id===t.dataset.role).role=t.value;save();render()}
 if(t.id==='teamName'){S.team=t.value;save()}
 if(t.id==='aTools'){S.angles.tools=t.value||'Tools';save()}if(t.id==='aTech'){S.angles.technology=t.value||'Technology';save()}
});
function demo(){const D=blank();D.team='Stars Elite 19U (demo)';
 const names=[['Button',17,'athlete'],['Avery Lind',4,'captain'],['Jo Marchetti',22,'captain'],['Riley Okafor',9,'athlete'],['Kenzie Hart',11,'athlete'],['Morgan Pike',27,'athlete'],['Tess Varga',31,'athlete'],['Quinn Dubois',6,'athlete']];
 D.users=[{id:'coach1',name:'Coach Reyes (sample)',role:'coach'},...names.map(([n,num,r],i)=>({id:'a'+i,name:n,number:num,role:r}))];
 const T=[['Breakout — strong-side up',['D retrieves with speed','Shoulder check before touch','Hard pass to strong-side wing','Center supports low']],['1-2-2 Forecheck',['F1 angles to boards','F2 reads and supports','D pinch on cue','Stick in lane']],['Power play — umbrella',['Win the entry','Point walks the line','Bumper finds soft ice','Net-front screen']],['Penalty kill — box',['Stay compact','Pressure on bobble','Clear to glass']],['D-zone coverage',['Man in front','Low cycle switch','Weak-side stick on ice']]];
 const opps=['Lakeshore Lynx','North Ridge Wolves','Capital Blades','Prairie Storm'];let r=7;const rnd=()=>{r=(r*9301+49297)%233280;return r/233280};
 const sc=(b,comp)=>{let v=Math.round(b+rnd()*2.2-1);return Math.max(-1,Math.min(comp&&rnd()>.85?3:2,v))};
 const start=new Date();start.setDate(start.getDate()-35);
 for(let d=0;d<14;d++){const dt=new Date(start);dt.setDate(start.getDate()+d*2.5|0);const comp=d%4===3;const t=T[d%T.length];
  const s={id:'s'+d,date:dt.toISOString().slice(0,10),type:comp?'competition':'practice',opponent:comp?opps[(d/4|0)%4]:'',tactic:t[0],techniques:t[1]};D.sessions.push(s);
  D.users.filter(u=>u.role!=='coach').forEach((u,i)=>{if(rnd()<.1)return;const sleep=Math.round((6+rnd()*3.5)*2)/2;const base=(sleep-7.5)*.5+d*.05+(i===0?.3:0);
   D.entries.push({sessionId:s.id,athleteId:u.id,focus:['Quick feet on retrieval','Communicate early','Win puck battles','Stick on puck'][(i+d)%4],techScores:t[1].map(()=>sc(base+.4,comp)),selfPerf:sc(base+.3,comp),selfVal:sc(base+.6,comp),tools:'Edges, stick, voice',tech:rnd()>.5?'Video review app':'',ethos:D.ethos.map(()=>sc(.8,false)),factors:{sleepH:sleep,sleepQ:1+Math.round(rnd()*4),nutr:2+Math.round(rnd()*3),hyd:2+Math.round(rnd()*3),sore:1+Math.round(rnd()*4),stress:1+Math.round(rnd()*4),notes:'Pasta + chicken pre-game'}});
   ['a1','a2','coach1'].filter(x=>x!==u.id).forEach(rid=>{if(rnd()<.5)D.others.push({sessionId:s.id,athleteId:u.id,raterId:rid,perf:sc(base+.2,comp),val:sc(base+.7,comp)})})})}
 D.me='coach1';return D}
render();
</script></body></html>
