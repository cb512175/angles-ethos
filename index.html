<script>
const POS={F:'Forward',D:'Defense',G:'Goalie'},POSP={F:'Forwards',D:'Defense',G:'Goalies'};
const KEY='ae_angles_ethos_v1';
const ELITE=3; // PLACEHOLDER value for Elite — RC may change
const SCALE=[[-1,'Bad'],[0,'Average'],[1,'Good'],[2,'Excellent']];

let S=load(); let tab=null; let draft={};
function blank(){return{team:'My Team',users:[{id:'coach1',name:'Coach',role:'coach'}],ethos:['Was I coachable?','Did I think of others first?','Did the mission stay the main thing?','Did I look for small things that needed to get done?','Did I work hard?'],angles:{tools:'Tools',technology:'Technology'},sessions:[],entries:[],others:[],me:'coach1'}}
function migrate(d){const b=blank();if(!d||typeof d!=='object')return b;d.angles={tools:'Tools',technology:'Technology'};for(const k in b)if(d[k]==null)d[k]=b[k];if(!Array.isArray(d.ethos)||d.ethos.some(x=>/placeholder/i.test(x)))d.ethos=b.ethos;while(d.ethos.length<5)d.ethos.push(b.ethos[d.ethos.length]);
 ['users','sessions','entries','others'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});d.entries.forEach(e=>{if(!Array.isArray(e.ethos))e.ethos=[];if(!Array.isArray(e.ethosNotes))e.ethosNotes=[];if(!Array.isArray(e.techScores))e.techScores=[];e.factors=e.factors||{};if(!Array.isArray(e.toolScores)){e.toolScores=[];e.techGear=[];if(e.tools||e.tech)e.gearNote=[e.tools&&('Tools: '+e.tools),e.tech&&('Technology: '+e.tech)].filter(Boolean).join(' · ');if(e.tech==='N/A')e.techNA=true}if(!Array.isArray(e.techGear))e.techGear=[]});d.sessions.forEach(x=>{if(!Array.isArray(x.techniques))x.techniques=[];if(!Array.isArray(x.tools))x.tools=[];if(!Array.isArray(x.tech))x.tech=[]});d.users.forEach(u=>{if(u.role!=='coach'&&!POS[u.pos])u.pos='F'});d.sessions.forEach(x=>{if(!x.groups||typeof x.groups!=='object')x.groups={};for(const g in x.groups){const c=x.groups[g];if(!POS[g]||!c||typeof c!=='object'){delete x.groups[g];continue}['techniques','tools','tech'].forEach(k=>{if(!Array.isArray(c[k]))c[k]=[]});if(!c.techniques.length)delete x.groups[g]}if(x.scope!=='team'&&x.scope!=='groups'){if(Object.keys(x.groups).length){Object.keys(POS).forEach(g=>{if(!x.groups[g])x.groups[g]={techniques:[...x.techniques],tools:[...x.tools],tech:[...x.tech]}});x.scope='groups'}else x.scope='team'}if(x.scope==='groups'){for(const g in x.groups)if(typeof x.groups[g].tactic!=='string'||!x.groups[g].tactic)x.groups[g].tactic=x.tactic||'';if(!Object.keys(x.groups).length)x.scope='team'}else x.groups={};if(typeof x.tactic!=='string')x.tactic=''});d.sessions.forEach(x=>{const n=x.coachNotes;if(!n||typeof n!=='object'||Array.isArray(n)){x.coachNotes=typeof n==='string'&&n.trim()?{change:n,learned:'',surprised:'',at:null}:null}else['change','learned','surprised'].forEach(k=>{if(typeof n[k]!=='string')n[k]=''})});d.entries.forEach(e=>{const f=e.factors;if(f.life===undefined&&f.rec===undefined&&f.nutrition===undefined){const ok=v=>typeof v==='number'&&v>=1&&v<=5;const nf={sleepH:f.sleepH??null,sleep:ok(f.sleepQ)?f.sleepQ:null,nutrition:ok(f.nutr)?f.nutr:null,life:ok(f.stress)?6-f.stress:null,notes:f.notes||''};const rr=[ok(f.sore)?6-f.sore:null,ok(f.hyd)?f.hyd:null].filter(v=>v!=null);nf.rec=rr.length?Math.round(rr.reduce((a,b)=>a+b,0)/rr.length*10)/10:null;e.factors=nf}});d.others.forEach(o=>{if(!Array.isArray(o.ethos))o.ethos=[];o.ethos=o.ethos.slice(0,5).map(v=>typeof v==='number'&&v>=-1&&v<=2?v:null);if(typeof o.note!=='string')o.note=''});d.entries.forEach(e=>{const f=e.factors;if(f.meals===undefined&&f.other===undefined){const n=(f.notes||'').trim();f.meals=/pasta|chicken|pre-game|meal|ate|breakfast|lunch|dinner|snack/i.test(n)?n:'';f.other=f.meals?'':n}if(typeof f.meals!=='string')f.meals='';if(typeof f.other!=='string')f.other='';delete f.notes;if(!['me','coach','cc'].includes(f.share))f.share='me'});d.v=10;return d}
function sharedNotes(aids,viewer,title){const A=new Set(aids),ok=viewer==='captain'?['cc']:['coach','cc'];const L=S.entries.filter(e=>A.has(e.athleteId)&&e.factors&&ok.includes(e.factors.share)&&((e.factors.meals||'').trim()||(e.factors.other||'').trim())&&sess(e.sessionId)).sort((a,b)=>sess(b.sessionId).date.localeCompare(sess(a.sessionId).date)).slice(0,8);return `<div class="card sharedn"><h2>${title||'Shared off-ice notes'}</h2><p class="muted" style="margin-top:0">${viewer==='captain'?'Only notes players shared with coaches &amp; captains.':'Notes players chose to share with coaches (or coaches &amp; captains).'}</p>${L.length?L.map(e=>{const u=S.users.find(u=>u.id===e.athleteId),x=sess(e.sessionId),f=e.factors;return `<div class="it" style="display:block"><div><b>${esc(u?u.name:'?')}</b> <span class="muted" style="font-size:11px">${x.date.slice(5)} · ${f.share==='cc'?'Coaches &amp; captains':'Coaches'}</span></div>${f.meals?`<div style="font-size:13px"><span class="muted">Meals:</span> ${esc(f.meals)}</div>`:''}${f.other?`<div style="font-size:13px"><span class="muted">Other:</span> ${esc(f.other)}</div>`:''}</div>`}).join(''):'<p class="muted">Nothing shared yet.</p>'}</div>`}
const SCL=()=>(S.users.find(u=>u.id===S.me)||{}).role==='captain'?'Captain Score':'Coach Score';
const ESH=['Coachable','Others first','Mission','Small things','Work hard'];
function playerCmp(aid){const L=sorted().filter(x=>S.entries.some(e=>e.sessionId===x.id&&e.athleteId===aid)||S.others.some(o=>o.sessionId===x.id&&o.athleteId===aid)).slice(-5),ids=new Set(L.map(x=>x.id));const EN=S.entries.filter(e=>ids.has(e.sessionId)&&e.athleteId===aid),OT=S.others.filter(o=>ids.has(o.sessionId)&&o.athleteId===aid);return [{n:'Tm Perf',me:avg(EN.map(e=>e.selfPerf)),co:avg(OT.map(o=>o.perf))},{n:'Tm Value',me:avg(EN.map(e=>e.selfVal)),co:avg(OT.map(o=>o.val))},...S.ethos.map((_,i)=>({n:ESH[i]||('Pillar '+(i+1)),me:avg(EN.map(e=>(e.ethos||[])[i])),co:avg(OT.map(o=>(o.ethos||[])[i]))}))]}
function playerEthosCard(as,lab){if(!as.length)return '';const cols=playerCmp(as[0].id).map(c=>c.n);const cell=(c,big)=>{let g=c.me!=null&&c.co!=null?c.me-c.co:null;if(g!=null&&Math.abs(g)<0.05)g=0;const col=g==null?'inherit':Math.abs(g)<0.5?'#2fae66':'#d4af37';return `<td style="text-align:center;padding:4px 5px;white-space:nowrap;border-left:1px solid #1e6b42;${big?'background:rgba(255,127,107,.18);outline:1px solid #ff7f6b;':''}"><span>${fmt(c.me)}</span><span class="muted"> / </span><span>${c.co==null?'–':fmt(c.co)}</span><br><b style="color:${col};font-size:11px">${g==null?'–':(g>0?'+':'')+g.toFixed(1)}</b>${big?'<div style="font-size:9px;color:#ff7f6b">▲ overrates</div>':''}</td>`};const rows=as.map(a=>{const cs=playerCmp(a.id);let bi=-1,bg=0.5;cs.forEach((c,i)=>{if(c.me!=null&&c.co!=null&&c.me-c.co>=bg){bg=c.me-c.co;bi=i}});return `<tr data-drill="${a.id}" style="cursor:pointer;border-top:1px solid #1e6b42"><td style="position:sticky;left:0;background:var(--navy2);padding:4px 6px;white-space:nowrap;font-weight:600">${esc(a.name)} <span class="tag">${POS[posOf(a)]}</span> ›</td>${cs.map((c,i)=>cell(c,i===bi)).join('')}</tr>`}).join('');return `<div class="card pecard"><h2>${lab}: Player Ethos &amp; Teammates — Self vs Coach</h2><p class="muted" style="margin-top:0">Last 5 sessions per player. Each cell: Self / Coach, Gap below (green = small, gold = big). <span style="color:#ff7f6b">Coral</span> = player's biggest overrating (Self ≥0.5 above Coach). '–' = not scored. Tap a player for their trends.</p><div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><table style="border-collapse:collapse;font-size:12px;min-width:640px"><tr class="muted"><td style="position:sticky;left:0;background:var(--navy2);padding:4px 6px">Player</td>${cols.map(c=>`<td style="text-align:center;padding:4px 5px;white-space:nowrap">${c}</td>`).join('')}</tr>${rows}</table></div><div class="muted" style="font-size:11px;margin-top:6px;line-height:1.4">Tm Perf / Tm Value = Teammates Performance / Value. ${S.ethos.map((n,i)=>`<b>${ESH[i]||'Pillar '+(i+1)}</b>: ${esc(n)}`).join(' · ')}</div></div>`}
function ethosCmp(aids){const A=new Set(aids);const L=sorted().filter(x=>S.entries.some(e=>e.sessionId===x.id&&A.has(e.athleteId))||S.others.some(o=>o.sessionId===x.id&&A.has(o.athleteId))).slice(-5),ids=new Set(L.map(x=>x.id));const EN=S.entries.filter(e=>ids.has(e.sessionId)&&A.has(e.athleteId)),OT=S.others.filter(o=>ids.has(o.sessionId)&&A.has(o.athleteId));return S.ethos.map((n,i)=>({n,me:avg(EN.map(e=>(e.ethos||[])[i])),co:avg(OT.map(o=>(o.ethos||[])[i])),c:OT.filter(o=>(o.ethos||[])[i]!=null).length}))}
function ethosTable(rows,meLab){const gap=(a,c)=>{const g=(a!=null&&c!=null)?a-c:null;return `<td style="text-align:center;color:${g==null?'inherit':Math.abs(g)<0.5?'#2fae66':'#d4af37'}">${g==null?'–':(g>0?'+':'')+g.toFixed(1)}</td>`};return `<table class="ethcmp" style="width:100%;border-collapse:collapse;font-size:13px;margin-top:6px"><tr class="muted"><td>Ethos Pillar</td><td style="text-align:center">${meLab}</td><td style="text-align:center">Coaches</td><td style="text-align:center">Gap</td></tr>${rows.map(r=>`<tr><td style="padding:3px 0">${esc(r.n)}</td><td style="text-align:center">${fmt(r.me)}</td><td style="text-align:center">${r.co==null?'–':fmt(r.co)}</td>${r.co==null?'<td style="text-align:center">–</td>':gap(r.me,r.co)}</tr>`).join('')}</table>`}
let facHi=(()=>{try{return sessionStorage.getItem('ae_facHi')||null}catch(e){return null}})();
const FAC=[{k:'sleep',n:'Sleep',c:'#d4af37'},{k:'nutrition',n:'Nutrition',c:'#ffffff'},{k:'life',n:'Life away from the ice',c:'#5ec8f2'},{k:'rec',n:'Recovery',c:'#ff7f6b'}];
function facChart(pts,ctx){if(!pts.some(p=>FAC.some(f=>p[f.k]!=null)))return '<p class="muted">No Additional Factors logged yet.</p>';const W=340,H=170,L=26,R=ctx?26:6,T=8,B=20,iw=W-L-R,ih=H-T-B;const y=v=>T+ih*(1-(v-1)/4),x=i=>L+(pts.length<2?iw/2:iw*i/(pts.length-1));let g='';[1,2,3,4,5].forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#1e6b42" stroke-dasharray="2 3"/><text x="8" y="${y(v)+3}">${v}</text>`);
 if(ctx){const cy=v=>T+ih*(1-(v+1)/3);let d='';pts.forEach((p,i)=>{if(p[ctx.k]!=null)d+=(d?'L':'M')+x(i).toFixed(1)+','+cy(p[ctx.k]).toFixed(1)});g+=`<path d="${d}" fill="none" stroke="#9fbfa9" stroke-width="1.5" stroke-dasharray="4 3" opacity=".55"/><text x="${W-R+2}" y="${cy(0)+3}">0</text><text x="${W-R+2}" y="${cy(2)+3}">+2</text>`}
 const hi=FAC.some(f=>f.k===facHi)?facHi:null;FAC.forEach(l=>{const op=!hi||hi===l.k?1:.15,sw=hi===l.k?3.5:2;let d='';pts.forEach((p,i)=>{if(p[l.k]!=null)d+=(d?'L':'M')+x(i).toFixed(1)+','+y(p[l.k]).toFixed(1)});g+=`<path class="fac-${l.k}" d="${d}" fill="none" stroke="${l.c}" stroke-width="${sw}" opacity="${op}"/>`;pts.forEach((p,i)=>{if(p[l.k]!=null)g+=`<circle cx="${x(i)}" cy="${y(p[l.k])}" r="${hi===l.k?3.2:2.2}" fill="${l.c}" opacity="${op}"/>`})});
 const step=Math.ceil(pts.length/6);pts.forEach((p,i)=>{if(i%step===0)g+=`<text x="${x(i)-10}" y="${H-5}">${p.label}</text>`});
 return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg><div class="legend faclg"><span data-fac="" style="cursor:pointer;padding:2px 8px;border:1px solid ${hi?'var(--line)':'var(--gold)'};border-radius:10px;${hi?'':'color:var(--gold)'}">All</span>${FAC.map(l=>`<span data-fac="${l.k}" style="cursor:pointer;padding:2px 6px;border-radius:10px;opacity:${!hi||hi===l.k?1:.4};${hi===l.k?`border:1px solid ${l.c};font-weight:700`:'border:1px solid transparent'}"><i style="background:${l.c}"></i>${l.n}</span>`).join('')}${ctx?`<span><i style="background:#9fbfa9;opacity:.6"></i>${ctx.n} (dashed, right axis)</span>`:''}</div><p class="muted" style="font-size:11px;margin:4px 0 0">Rated 1–5, higher = better. Tap a factor to highlight it.</p>`}
const facPts=(es)=>Object.fromEntries(FAC.map(f=>[f.k,avg(es.map(e=>e?.factors?.[f.k]))]));
