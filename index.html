<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AchievementEquation • Angles &amp; Ethos</title>
<style>
:root{--navy:#0a0a0a;--navy2:#10241a;--steel:#b9cdbf;--line:#1e6b42;--gold:#d4af37;--txt:#ffffff;--bad:#d9534f;--good:#4caf7a}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--navy);color:var(--txt)}

.who select{width:auto;flex:1}nav{display:flex;gap:4px;overflow-x:auto;margin-top:8px}
nav button{flex:0 0 auto;background:none;border:1px solid var(--line);color:var(--steel);border-radius:20px;padding:6px 12px;font-size:13px}

.card{background:var(--navy2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}

.btn{background:var(--gold);color:var(--navy);border:0;border-radius:8px;padding:10px 14px;font-weight:700;font-size:15px;cursor:pointer}
.btn.sec{background:none;color:var(--txt);border:1px solid var(--steel)}.btn.sm{padding:6px 10px;font-size:13px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.scale{display:flex;gap:4px;flex-wrap:wrap}.scale button{flex:1;min-width:52px;padding:8px 2px;border-radius:8px;border:1px solid var(--line);background:#0f2d1e;color:var(--txt);font-size:12px}
.scale button b{display:block;font-size:15px}.scale button.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.scale button.elite{border-color:var(--gold)}

.muted{color:var(--steel);font-size:13px}.big{font-size:28px;font-weight:800;color:var(--gold)}

.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--navy);padding:10px 16px;border-radius:20px;font-weight:700;display:none}

footer a,footer button{font-size:12px;color:var(--steel);background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;text-decoration:none}
svg text{fill:var(--steel);font-size:10px}.legend span{font-size:12px;margin-right:10px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.half{color:var(--gold);font-size:15px;margin:18px 4px 8px;border-bottom:2px solid var(--gold);padding-bottom:4px}.enote{margin-top:6px;font-size:13px}</style></head><body>
<header><div class="brand"><b>Achievement</b>Equation • Prototype</div><h1>Angles <span>&amp;</span> Ethos</h1>
<div class="who"><span class="muted">Viewing as</span><select id="userSel"></select></div><nav id="nav"></nav></header>
<main id="app"></main><div class="toast" id="toast"></div>
<footer><a id="fb" href="mailto:clint@holdfasthq.com?subject=Angles%20%26%20Ethos%20feedback">✉ Feedback</a><button id="demoBtn">Load demo data</button><button id="resetBtn">Reset</button></footer>
<script>
const POS={F:'Forward',D:'Defense',G:'Goalie'},POSP={F:'Forwards',D:'Defense',G:'Goalies'};
const KEY='ae_angles_ethos_v1';
const ELITE=3; // PLACEHOLDER value for Elite — RC may change
const SCALE=[[-1,'Bad'],[0,'Average'],[1,'Good'],[2,'Excellent']];
const uid=()=>Math.random().toString(36).slice(2,9);
let S=load(); let tab=null; let draft={};
function blank(){return{team:'My Team',users:[{id:'coach1',name:'Coach',role:'coach'}],ethos:['Was I coachable?','Did I think of others first?','Did the mission stay the main thing?','Did I look for small things that needed to get done?','Did I work hard?'],angles:{tools:'Tools',technology:'Technology'},sessions:[],entries:[],others:[],me:'coach1'}}
function migrate(d){const b=blank();if(!d||typeof d!=='object')return b;d.angles={tools:'Tools',technology:'Technology'};for(const k in b)if(d[k]==null)d[k]=b[k];if(!Array.isArray(d.ethos)||d.ethos.some(x=>/placeholder/i.test(x)))d.ethos=b.ethos;while(d.ethos.length<5)d.ethos.push(b.ethos[d.ethos.length]);
 ['users','sessions','entries','others'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});d.entries.forEach(e=>{if(!Array.isArray(e.ethos))e.ethos=[];if(!Array.isArray(e.ethosNotes))e.ethosNotes=[];if(!Array.isArray(e.techScores))e.techScores=[];e.factors=e.factors||{};if(!Array.isArray(e.toolScores)){e.toolScores=[];e.techGear=[];if(e.tools||e.tech)e.gearNote=[e.tools&&('Tools: '+e.tools),e.tech&&('Technology: '+e.tech)].filter(Boolean).join(' · ');if(e.tech==='N/A')e.techNA=true}if(!Array.isArray(e.techGear))e.techGear=[]});d.sessions.forEach(x=>{if(!Array.isArray(x.techniques))x.techniques=[];if(!Array.isArray(x.tools))x.tools=[];if(!Array.isArray(x.tech))x.tech=[]});d.users.forEach(u=>{if(u.role!=='coach'&&!POS[u.pos])u.pos='F'});d.sessions.forEach(x=>{if(!x.groups||typeof x.groups!=='object')x.groups={};for(const g in x.groups){const c=x.groups[g];if(!POS[g]||!c||typeof c!=='object'){delete x.groups[g];continue}['techniques','tools','tech'].forEach(k=>{if(!Array.isArray(c[k]))c[k]=[]});if(!c.techniques.length)delete x.groups[g]}});d.sessions.forEach(x=>{const n=x.coachNotes;if(!n||typeof n!=='object'||Array.isArray(n)){x.coachNotes=typeof n==='string'&&n.trim()?{change:n,learned:'',surprised:'',at:null}:null}else['change','learned','surprised'].forEach(k=>{if(typeof n[k]!=='string')n[k]=''})});d.entries.forEach(e=>{const f=e.factors;if(f.life===undefined&&f.rec===undefined&&f.nutrition===undefined){const ok=v=>typeof v==='number'&&v>=1&&v<=5;const nf={sleepH:f.sleepH??null,sleep:ok(f.sleepQ)?f.sleepQ:null,nutrition:ok(f.nutr)?f.nutr:null,life:ok(f.stress)?6-f.stress:null,notes:f.notes||''};const rr=[ok(f.sore)?6-f.sore:null,ok(f.hyd)?f.hyd:null].filter(v=>v!=null);nf.rec=rr.length?Math.round(rr.reduce((a,b)=>a+b,0)/rr.length*10)/10:null;e.factors=nf}});d.others.forEach(o=>{if(!Array.isArray(o.ethos))o.ethos=[];o.ethos=o.ethos.slice(0,5).map(v=>typeof v==='number'&&v>=-1&&v<=2?v:null);if(typeof o.note!=='string')o.note=''});d.v=7;return d}
const SCL=()=>(S.users.find(u=>u.id===S.me)||{}).role==='captain'?'Captain Score':'Coach Score';
const ESH=['Coachable','Others first','Mission','Small things','Work hard'];
function playerCmp(aid){const L=sorted().filter(x=>S.entries.some(e=>e.sessionId===x.id&&e.athleteId===aid)||S.others.some(o=>o.sessionId===x.id&&o.athleteId===aid)).slice(-5),ids=new Set(L.map(x=>x.id));const EN=S.entries.filter(e=>ids.has(e.sessionId)&&e.athleteId===aid),OT=S.others.filter(o=>ids.has(o.sessionId)&&o.athleteId===aid);return [{n:'Tm Perf',me:avg(EN.map(e=>e.selfPerf)),co:avg(OT.map(o=>o.perf))},{n:'Tm Value',me:avg(EN.map(e=>e.selfVal)),co:avg(OT.map(o=>o.val))},...S.ethos.map((_,i)=>({n:ESH[i]||('Pillar '+(i+1)),me:avg(EN.map(e=>(e.ethos||[])[i])),co:avg(OT.map(o=>(o.ethos||[])[i]))}))]}
function playerEthosCard(as,lab){if(!as.length)return '';const cols=playerCmp(as[0].id).map(c=>c.n);const cell=(c,big)=>{let g=c.me!=null&&c.co!=null?c.me-c.co:null;if(g!=null&&Math.abs(g)<0.05)g=0;const col=g==null?'inherit':Math.abs(g)<0.5?'#2fae66':'#d4af37';return `<td style="text-align:center;padding:4px 5px;white-space:nowrap;border-left:1px solid #1e6b42;${big?'background:rgba(255,127,107,.18);outline:1px solid #ff7f6b;':''}"><span>${fmt(c.me)}</span><span class="muted"> / </span><span>${c.co==null?'–':fmt(c.co)}</span><br><b style="color:${col};font-size:11px">${g==null?'–':(g>0?'+':'')+g.toFixed(1)}</b>${big?'<div style="font-size:9px;color:#ff7f6b">▲ overrates</div>':''}</td>`};const rows=as.map(a=>{const cs=playerCmp(a.id);let bi=-1,bg=0.5;cs.forEach((c,i)=>{if(c.me!=null&&c.co!=null&&c.me-c.co>=bg){bg=c.me-c.co;bi=i}});return `<tr data-drill="${a.id}" style="cursor:pointer;border-top:1px solid #1e6b42"><td style="position:sticky;left:0;background:var(--navy2);padding:4px 6px;white-space:nowrap;font-weight:600">${esc(a.name)} <span class="tag">${POS[posOf(a)]}</span> ›</td>${cs.map((c,i)=>cell(c,i===bi)).join('')}</tr>`}).join('');return `<div class="card pecard"><h2>${lab}: Player Ethos &amp; Teammates — Self vs Coach</h2><p class="muted" style="margin-top:0">Last 5 sessions per player. Each cell: Self / Coach, Gap below (green = small, gold = big). <span style="color:#ff7f6b">Coral</span> = player's biggest overrating (Self ≥0.5 above Coach). '–' = not scored. Tap a player for their trends.</p><div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><table style="border-collapse:collapse;font-size:12px;min-width:640px"><tr class="muted"><td style="position:sticky;left:0;background:var(--navy2);padding:4px 6px">Player</td>${cols.map(c=>`<td style="text-align:center;padding:4px 5px;white-space:nowrap">${c}</td>`).join('')}</tr>${rows}</table></div><div class="muted" style="font-size:11px;margin-top:6px;line-height:1.4">Tm Perf / Tm Value = Teammates Performance / Value. ${S.ethos.map((n,i)=>`<b>${ESH[i]||'Pillar '+(i+1)}</b>: ${esc(n)}`).join(' · ')}</div></div>`}
function ethosCmp(aids){const A=new Set(aids);const L=sorted().filter(x=>S.entries.some(e=>e.sessionId===x.id&&A.has(e.athleteId))||S.others.some(o=>o.sessionId===x.id&&A.has(o.athleteId))).slice(-5),ids=new Set(L.map(x=>x.id));const EN=S.entries.filter(e=>ids.has(e.sessionId)&&A.has(e.athleteId)),OT=S.others.filter(o=>ids.has(o.sessionId)&&A.has(o.athleteId));return S.ethos.map((n,i)=>({n,me:avg(EN.map(e=>(e.ethos||[])[i])),co:avg(OT.map(o=>(o.ethos||[])[i])),c:OT.filter(o=>(o.ethos||[])[i]!=null).length}))}
function ethosTable(rows,meLab){const gap=(a,c)=>{const g=(a!=null&&c!=null)?a-c:null;return `<td style="text-align:center;color:${g==null?'inherit':Math.abs(g)<0.5?'#2fae66':'#d4af37'}">${g==null?'–':(g>0?'+':'')+g.toFixed(1)}</td>`};return `<table class="ethcmp" style="width:100%;border-collapse:collapse;font-size:13px;margin-top:6px"><tr class="muted"><td>Ethos Pillar</td><td style="text-align:center">${meLab}</td><td style="text-align:center">Coaches</td><td style="text-align:center">Gap</td></tr>${rows.map(r=>`<tr><td style="padding:3px 0">${esc(r.n)}</td><td style="text-align:center">${fmt(r.me)}</td><td style="text-align:center">${r.co==null?'–':fmt(r.co)}</td>${r.co==null?'<td style="text-align:center">–</td>':gap(r.me,r.co)}</tr>`).join('')}</table>`}
const FAC=[{k:'sleep',n:'Sleep',c:'#d4af37'},{k:'nutrition',n:'Nutrition',c:'#ffffff'},{k:'life',n:'Life away from the ice',c:'#5ec8f2'},{k:'rec',n:'Recovery',c:'#ff7f6b'}];
function facChart(pts,ctx){if(!pts.some(p=>FAC.some(f=>p[f.k]!=null)))return '<p class="muted">No Additional Factors logged yet.</p>';const W=340,H=170,L=26,R=ctx?26:6,T=8,B=20,iw=W-L-R,ih=H-T-B;const y=v=>T+ih*(1-(v-1)/4),x=i=>L+(pts.length<2?iw/2:iw*i/(pts.length-1));let g='';[1,2,3,4,5].forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#1e6b42" stroke-dasharray="2 3"/><text x="8" y="${y(v)+3}">${v}</text>`);
 if(ctx){const cy=v=>T+ih*(1-(v+1)/3);let d='';pts.forEach((p,i)=>{if(p[ctx.k]!=null)d+=(d?'L':'M')+x(i).toFixed(1)+','+cy(p[ctx.k]).toFixed(1)});g+=`<path d="${d}" fill="none" stroke="#9fbfa9" stroke-width="1.5" stroke-dasharray="4 3" opacity=".55"/><text x="${W-R+2}" y="${cy(0)+3}">0</text><text x="${W-R+2}" y="${cy(2)+3}">+2</text>`}
 FAC.forEach(l=>{let d='';pts.forEach((p,i)=>{if(p[l.k]!=null)d+=(d?'L':'M')+x(i).toFixed(1)+','+y(p[l.k]).toFixed(1)});g+=`<path class="fac-${l.k}" d="${d}" fill="none" stroke="${l.c}" stroke-width="2"/>`;pts.forEach((p,i)=>{if(p[l.k]!=null)g+=`<circle cx="${x(i)}" cy="${y(p[l.k])}" r="2.2" fill="${l.c}"/>`})});
 const step=Math.ceil(pts.length/6);pts.forEach((p,i)=>{if(i%step===0)g+=`<text x="${x(i)-10}" y="${H-5}">${p.label}</text>`});
 return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg><div class="legend">${FAC.map(l=>`<span><i style="background:${l.c}"></i>${l.n}</span>`).join('')}${ctx?`<span><i style="background:#9fbfa9;opacity:.6"></i>${ctx.n} (dashed, right axis)</span>`:''}</div><p class="muted" style="font-size:11px;margin:4px 0 0">Rated 1–5, higher = better.</p>`}
const facPts=(es)=>Object.fromEntries(FAC.map(f=>[f.k,avg(es.map(e=>e?.factors?.[f.k]))]));
const posOf=u=>u&&POS[u.pos]?u.pos:'F';
const lines=id=>document.getElementById(id).value.split('\n').map(s=>s.trim()).filter(Boolean);
function planFor(x,aid){const u=S.users.find(u=>u.id===aid),g=posOf(u),c=x&&x.groups&&x.groups[g];
 if(c)return{techniques:c.techniques||[],tools:c.tools||[],tech:c.tech||[],grp:g};return{techniques:x.techniques||[],tools:x.tools||[],tech:x.tech||[],grp:null}}
let gTab='D';
function load(){try{return migrate(JSON.parse(localStorage.getItem(KEY)))}catch(e){return blank()}}
const playerScore=e=>e?avg([avg(e.techScores||[]),e.selfPerf,e.selfVal]):null;
const gearScore=e=>e?avg([...(e.toolScores||[]),...(e.techGear||[]).filter(v=>v!=='NA'),e.extra&&e.extra.name?e.extra.score:null]):null;
const memberScore=e=>e?avg(e.ethos||[]):null;
const totalScore=e=>{const p=playerScore(e),m=memberScore(e);return p==null||m==null?null:p+m};
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
const me=()=>S.users.find(u=>u.id===S.me)||S.users[0];
const athletes=()=>S.users.filter(u=>u.role!=='coach');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const avg=a=>{a=a.filter(x=>x!=null&&x!=='');return a.length?a.reduce((p,c)=>p+ +c,0)/a.length:null};
const fmt=v=>v==null?'—':(v>0?'+':'')+(+v).toFixed(1);
const hasNotes=x=>!!(x&&x.coachNotes&&['change','learned','surprised'].some(k=>(x.coachNotes[k]||'').trim()));
const NQ=[['change',"What I'd change next time"],['learned','What I learned'],['surprised','What surprised me']];
const fmtAt=t=>t?new Date(t).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';
function planHTML(x){const blk=(h,P)=>`${h?`<h3>${h}</h3>`:''}<p class="muted" style="margin:4px 0"><b>Techniques:</b> ${P.techniques.map(esc).join(' · ')||'–'}<br><b>Tools:</b> ${(P.tools||[]).map(esc).join(' · ')||'–'}<br><b>Technology (if used):</b> ${(P.tech||[]).map(esc).join(' · ')||'N/A'}</p>`;const gs=Object.keys(POS).filter(g=>x.groups&&x.groups[g]);return `<p style="margin:6px 0"><b>Tactic:</b> ${esc(x.tactic)}</p>`+blk(gs.length?'Team plan':'',x)+gs.map(g=>blk(POSP[g]+' plan',x.groups[g])).join('')}
function notesHTML(x){const n=x.coachNotes||{};return `<div class="cdet" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)"><span class="tag comp">🔒 Plan locked</span><p class="muted" style="font-style:italic;margin:4px 0">Plans lock once set. Capture what you'd change in Coach Notes.</p>${planHTML(x)}<h3 style="margin-top:10px;color:var(--gold)">Coach Notes <span class="muted" style="font-size:11px">(coach only)</span></h3>${NQ.map(([k,l])=>`<label>${l}</label><textarea data-cn="${k}" rows="2">${esc(n[k]||'')}</textarea>`).join('')}<p class="row" style="align-items:center"><button class="btn sm" data-savecn="${x.id}" style="flex:0 0 auto">Save notes</button><span class="muted" id="cnAt">${n.at?'Saved '+fmtAt(n.at):'Not saved yet'}</span></p></div>`}
const sess=id=>S.sessions.find(s=>s.id===id);
const sorted=()=>[...S.sessions].sort((a,b)=>a.date.localeCompare(b.date));
function scaleHTML(key,val,comp){let h=SCALE.map(([v,l])=>`<button data-k="${key}" data-v="${v}" class="${val===v?'on':''}"><b>${v>0?'+':''}${v}</b>${l}</button>`).join('');
 if(comp)h+=`<button data-k="${key}" data-v="${ELITE}" class="elite ${val===ELITE?'on':''}"><b>+${ELITE}</b>Elite*</button>`;return `<div class="scale">${h}</div>`}
function tabsFor(r){return r==='coach'?[['sessions','Sessions'],['others','Score Others'],['team','Trends'],['roster','Roster']]:r==='captain'?[['log','Sessions'],['others','Score Others'],['trends','Trends']]:[['log','Sessions'],['trends','Trends']]}
function render(){
 const us=document.getElementById('userSel');us.innerHTML=['coach','captain','athlete'].map(r=>`<optgroup label="${r[0].toUpperCase()+r.slice(1)}">`+S.users.filter(u=>u.role===r).map(u=>`<option value="${u.id}" ${u.id===S.me?'selected':''}>${esc(u.name)}${u.number?' #'+u.number:''}</option>`).join('')+'</optgroup>').join('');
 const tabs=tabsFor(me().role);if(!tabs.find(t=>t[0]===tab))tab=tabs[0][0];
 document.getElementById('nav').innerHTML=tabs.map(([k,l])=>`<button data-tab="${k}" class="${k===tab?'on':''}">${l}</button>`).join('');
 document.getElementById('app').innerHTML=(V[tab]||(()=>''))();after[tab]&&after[tab]();
}
function aeRef(edit){const A=[['Tactics','The play, plan or process. Scored from your Techniques.'],['Techniques','The steps that execute the plan. Each one is scored.'],['Teammates','Self and Others, on Performance (skill) and Value (encouraging, sacrificial, humble, on-plan).'],[S.angles.tools||'Tools','The fundamentals you use to execute.'],[(S.angles.technology||'Technology')+' (if used)','Enhancements to the tools (map & compass = tools, GPS = technology).']];
return `<div class="card" style="border-color:var(--gold)"><h2>Angles &amp; Ethos</h2><p class="muted">Every session is scored on both: how I performed as a player, and how I made my team and organization better.</p>
<h3 style="color:var(--gold)">The 5 Angles · As a Player</h3>${A.map((a,i)=>`<div class="it" style="padding:6px 0;border-bottom:1px solid var(--line);display:block"><b style="color:var(--gold)">${i+1}</b> <b>${esc(a[0])}</b><br><span class="muted">${esc(a[1])}</span></div>`).join('')}
<h3 style="color:var(--gold);margin-top:14px">The 5 Ethos Pillars · As a Member</h3>${edit?S.ethos.map((e,i)=>`<label>Pillar ${i+1}</label><input data-eth="${i}" value="${esc(e)}">`).join('')+'<p><button class="btn sm" id="saveEth">Save Ethos Pillars</button></p>':S.ethos.map((e,i)=>`<div class="it" style="padding:6px 0;border-bottom:1px solid var(--line)"><b style="color:var(--gold)">${i+1}</b> ${esc(e)}</div>`).join('')}</div>`}
const after={};
const V={
sessions(){const s=sorted().reverse();return `<div class="card"><h2>New Session</h2><p class="muted">Coach sets the Tactic and its Techniques for each session.</p>
<div class="row"><div><label>Date</label><input type="date" id="sDate" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Type</label><select id="sType"><option value="practice">Practice</option><option value="competition">Competition</option></select></div></div>

 <h2 class="half">Additional Factors</h2><div class="card"><p class="muted" style="margin-top:0;font-style:italic">Add when able. Notice how these impact you as an athlete, and collectively as a team.</p><div class="row"><div><label>Sleep (hrs)</label><input type="number" step="0.5" id="f_sleepH" value="${f.sleepH??''}"></div><div><label>Sleep 1-5</label><input type="number" min="1" max="5" id="f_sleep" value="${f.sleep??''}"></div></div>

 athletes().filter(a=>a.id!==S.me).map(a=>{const o=S.others.find(o=>o.sessionId===x.id&&o.athleteId===a.id&&o.raterId===S.me)||{};

trends(){return trendView(S.me)},

<div class="row" style="margin-top:10px"><input id="nName" placeholder="Name"><input id="nNum" placeholder="#" style="max-width:60px"><button class="btn sm" id="addU" style="flex:0 0 auto">Add</button></div></div>

};

 return{label:s.date.slice(5),comp:s.type==='competition',tac:e?avg(e.techScores):null,gear:gearScore(e),sp:e?.selfPerf??null,sv:e?.selfVal??null,op:avg(os.map(o=>o.perf)),ov:avg(os.map(o=>o.val)),eth:memberScore(e),ply:playerScore(e),tot:totalScore(e),...facPts([e])}}).filter(p=>p.tac!=null||p.op!=null)}
function gearPatterns(p){const last=p.filter(x=>x.gear!=null).slice(-5);if(!last.length)return '<p class="muted">No gear scores yet.</p>';const c={out:0,under:0,exc:0,bal:0};last.forEach(x=>{const d=x.tac-x.gear;if((x.tac<=0&&x.gear<=0)||x.flags>0)c.exc++;else if(d>=0.3)c.out++;else if(d<=-0.3)c.under++;else c.bal++});const row=(n,v,col,t)=>`<div style="display:flex;gap:10px;align-items:flex-start;padding:5px 0;border-top:1px solid #1e6b42"><b style="min-width:26px;text-align:center;font-size:16px;color:${col}">${v}</b><div style="flex:1;font-size:13px;line-height:1.3"><b style="color:${col}">${n}</b><div class="muted" style="font-size:11px">${t}</div></div></div>`;return `<div class="gearpat" style="margin-top:10px"><h3 style="margin:0 0 4px;font-size:13px">Last ${last.length} sessions</h3>${row('Outperforming gear',c.out,'#d4af37','Techniques avg ≥0.3 above Gear: skill is carrying the equipment.')}${row('Under-using gear',c.under,'#5ec8f2','Gear rated ≥0.3 above Techniques: the tools are there; execution isn\'t using them.')}${row('Gear as excuse?',c.exc,'#ff7f6b','Both low, or a player flagged gear and own play Average or lower. Ask: was it the gear, or me?')}${c.bal?row('Balanced',c.bal,'#ffffff','Play and gear within 0.3.'):''}</div>`}
function chart(pts,lines,bar){if(!pts.length)return '<p class="muted">No data yet.</p>';const W=340,H=170,L=26,R=bar?24:6,T=8,B=20,iw=W-L-R,ih=H-T-B;const y=v=>T+ih*(1-(v+1)/4.2),x=i=>L+(pts.length<2?iw/2:iw*i/(pts.length-1));
 let g='';[-1,0,1,2,3].forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#1e6b42" stroke-dasharray="${v===0?'':'2 3'}"/><text x="2" y="${y(v)+3}">${v>0?'+':''}${v}</text>`);
 if(bar){const by=v=>T+ih*(1-v/12);pts.forEach((p,i)=>{if(p[bar.k]!=null)g+=`<rect x="${x(i)-4}" y="${by(p[bar.k])}" width="8" height="${T+ih-by(p[bar.k])}" fill="${bar.c}" opacity=".35"/>`});g+=`<text x="${W-R+2}" y="${by(8)+3}">8h</text>`}
 lines.forEach(l=>{let d='';pts.forEach((p,i)=>{if(p[l.k]!=null)d+=(d?'L':'M')+x(i).toFixed(1)+','+y(p[l.k]).toFixed(1)});g+=`<path d="${d}" fill="none" stroke="${l.c}" stroke-width="2"/>`;pts.forEach((p,i)=>{if(p[l.k]!=null)g+=`<circle cx="${x(i)}" cy="${y(p[l.k])}" r="${p.comp?3.5:2.2}" fill="${l.c}"/>`})});
 const step=Math.ceil(pts.length/6);pts.forEach((p,i)=>{if(i%step===0)g+=`<text x="${x(i)-10}" y="${H-5}">${p.label}</text>`});
 return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg><div class="legend">${lines.map(l=>`<span><i style="background:${l.c}"></i>${l.n}</span>`).join('')}${bar?`<span><i style="background:${bar.c};opacity:.5"></i>${bar.n}</span>`:''}</div>`}
function gearItems(es){const m={};es.forEach(e=>{const x=sess(e.sessionId);if(!x)return;const add=(n,v)=>{if(v==null||v==='NA')return;(m[n]=m[n]||[]).push(+v)};const P=planFor(x,e.athleteId);P.tools.forEach((t,i)=>add(t,(e.toolScores||[])[i]));P.tech.forEach((t,i)=>add(t,(e.techGear||[])[i]));if(e.extra&&e.extra.name)add(e.extra.name,e.extra.score)});return Object.entries(m).map(([n,a])=>({n,avg:avg(a),low:a.filter(v=>v<=0).length,c:a.length}))}
